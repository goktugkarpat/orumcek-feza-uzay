'use strict';
// Ortak yardımcılar ve tüm dosyaların paylaştığı durum
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const lerpAngle = (a, b, t) => a + ((((b - a + Math.PI) % TAU) + TAU) % TAU - Math.PI) * t;
const FONT = 'ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",sans-serif';
const hx = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const hexF = h => hx(h).map(v => v / 255);
const rgba = (h, a) => { const c = hx(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const lighten = (h, t) => '#' + hx(h).map(v => Math.round(v + (255 - v) * t).toString(16).padStart(2, '0')).join('');
const darken = (h, t) => '#' + hx(h).map(v => Math.round(v * (1 - t)).toString(16).padStart(2, '0')).join('');
const mixA = (a, b, t) => `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
const mix = (a, b, t) => mixA(hx(a), hx(b), t);
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

let W = 0, H = 0, K = 1, HS = 1.4, DPR = 1, time = 0, camY = 0;
const cvs = $('game');
const mainCtx = cvs.getContext('2d');
let ctx = mainCtx;

<script>
// ── Grafik (WebGL arka plan) ──
'use strict';
// WebGL: canlı bulutsu arka plan, yıldızlar ve gerçek zamanlı dönen gezegenler
const glc = $('gl');
let gl = null;
try { gl = glc.getContext('webgl', { alpha: false, antialias: false, premultipliedAlpha: true }) || glc.getContext('experimental-webgl'); } catch (e) { gl = null; }

const GLSL_NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p,int o){float s=0.0,a=0.5,n=0.0;for(int i=0;i<6;i++){if(i>=o)break;s+=a*snoise(p);n+=a;p*=2.03;a*=0.5;}return s/n;}
float ridged(vec3 p,int o){float s=0.0,a=0.5,n=0.0;for(int i=0;i<6;i++){if(i>=o)break;float v=1.0-abs(snoise(p));s+=a*v*v;n+=a;p*=2.03;a*=0.5;}return s/n;}
mat2 rot2(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}
`;

const VS = `attribute vec2 aP; uniform vec4 uRect; void main(){ gl_Position=vec4(uRect.xy+aP*uRect.zw,0.0,1.0); }`;

const FS_NEB = `precision highp float;
uniform vec2 uRes; uniform float uTime, uOff, uAspect; uniform vec3 uN1, uN2;
${GLSL_NOISE}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  vec2 p=vec2(uv.x*uAspect,uv.y)*1.5+vec2(0.0,uOff);
  float tt=uTime*0.008;
  vec3 P=vec3(p*0.8,tt);
  float q=fbm(P,3);
  vec2 r=vec2(fbm(P+vec3(q*0.8+1.7,9.2,tt),3),fbm(P+vec3(8.3,q*0.8+2.8,-tt),3));
  float n=fbm(vec3(p*0.8+r*0.6,tt*0.7+5.0),4)*0.5+0.5;
  float dens=smoothstep(0.32,0.9,n);
  float core=smoothstep(0.7,0.95,n);
  vec3 c=mix(uN1,uN2,smoothstep(-0.4,0.4,r.x+uv.y*0.3-0.15))*dens*0.5+vec3(1.0,0.97,0.92)*core*0.18;
  gl_FragColor=vec4(c,1.0);
}`;

const FS_BG = `precision highp float;
uniform sampler2D uNeb; uniform vec2 uRes; uniform vec3 uTop, uBot; uniform float uTime, uCam, uDpr;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec3 stars(vec2 fc,float cell,float par,float prob,float br){
  vec2 p=vec2(fc.x,fc.y-uCam*par)/cell;
  vec2 id=floor(p); vec2 f=fract(p);
  float h=hash(id);
  if(h<prob) return vec3(0.0);
  vec2 o=vec2(hash(id+1.37),hash(id+7.91))*0.8+0.1;
  vec2 dp=(f-o)*cell;
  float d2=dot(dp,dp);
  float sz=(0.6+hash(id+3.3)*1.2)*uDpr*br;
  float core=exp(-d2/(sz*sz));
  float tw=0.55+0.45*sin(uTime*(1.0+h*3.0)+h*50.0);
  float hc=hash(id+5.5);
  vec3 sc=hc<0.33?vec3(1.0,0.92,0.6):hc<0.66?vec3(0.75,0.85,1.0):hc<0.85?vec3(1.0,0.75,0.9):vec3(0.75,1.0,0.9);
  float sp=0.0;
  if(br>1.0){
    sp=exp(-abs(dp.x)/(0.8*uDpr))*exp(-abs(dp.y)/(10.0*uDpr*br))+exp(-abs(dp.y)/(0.8*uDpr))*exp(-abs(dp.x)/(10.0*uDpr*br));
    sp*=0.5; core+=exp(-d2/(sz*sz*9.0))*0.25;
  }
  return sc*(core+sp)*tw*br;
}
void main(){
  vec2 fc=gl_FragCoord.xy; vec2 uv=fc/uRes;
  vec3 col=mix(uBot,uTop,uv.y);
  col+=texture2D(uNeb,uv).rgb*0.95;
  col+=stars(fc,38.0*uDpr,0.04,0.55,0.55);
  col+=stars(fc,85.0*uDpr,0.1,0.6,0.8);
  col+=stars(fc,210.0*uDpr,0.18,0.72,1.35);
  vec2 sp=vec2(-0.12*uRes.x,1.08*uRes.y); float sd=length(fc-sp)/uRes.y;
  col+=vec3(1.0,0.82,0.55)*(exp(-sd*2.2)*0.32+exp(-sd*10.0)*0.3);
  vec2 dq=vec2(fc.x+uTime*4.0*uDpr,fc.y-uCam*0.6)/(70.0*uDpr); vec2 did=floor(dq); vec2 dfp=fract(dq)-0.5; float dh=hash(did+9.1);
  if(dh>0.88){vec2 dop=vec2(hash(did+2.1),hash(did+4.2))-0.5;float dd=length((dfp-dop*0.8)*70.0*uDpr);col+=vec3(1.0,0.9,1.0)*exp(-dd*dd/(1.5*uDpr*uDpr))*0.25*(0.6+0.4*sin(uTime*2.0+dh*30.0));}
  vec2 vc=uv-0.5; col*=1.0-dot(vc,vc)*0.35;
  gl_FragColor=vec4(col,1.0);
}`;

const FS_PLANET = `precision highp float;
uniform vec2 uC; uniform float uR;
uniform float uType, uSeed, uRot, uTilt, uTime, uScale, uAtmK, uHalo, uRing, uRingRoll, uDim;
uniform vec3 uC1, uC2, uC3, uAtm, uRingCol, uL;
${GLSL_NOISE}
vec3 ramp3(float t){t=clamp(t,0.0,1.0);return t<0.5?mix(uC1,uC2,t*2.0):mix(uC2,uC3,(t-0.5)*2.0);}
vec3 ramp5(float v,vec3 a,vec3 b,vec3 c,vec3 d,vec3 e){v=clamp(v,0.0,1.0)*4.0;if(v<1.0)return mix(a,b,v);if(v<2.0)return mix(b,c,v-1.0);if(v<3.0)return mix(c,d,v-2.0);return mix(d,e,v-3.0);}
vec3 ringN(){vec3 n=vec3(0.0,cos(0.3),sin(0.3));n.xy=rot2(uRingRoll)*n.xy;return n;}
float ringDens(float r){
  if(r<1.3||r>2.2) return 0.0;
  float d=0.55+0.45*snoise(vec3(r*9.0,uSeed,0.5));
  d*=smoothstep(1.3,1.38,r)*(1.0-smoothstep(2.1,2.2,r));
  d*=mix(0.12,1.0,smoothstep(0.0,0.035,abs(r-1.8)));
  return clamp(d,0.0,1.0);
}
vec3 surface(vec3 t,vec3 n,out float spec,out vec3 emit){
  spec=0.0; emit=vec3(0.0);
  vec3 s=vec3(uSeed*7.1,uSeed*3.3,uSeed*1.7);
  float ty=uType; vec3 c=vec3(0.5);
  if(ty<0.5||(ty>12.5&&ty<13.5)){
    float h=fbm(t*1.7+s,6);
    if(h>0.03){c=ramp5(clamp((h-0.03)*3.2,0.0,1.0),vec3(.28,.45,.18),vec3(.2,.38,.14),vec3(.5,.44,.28),vec3(.62,.58,.5),vec3(.95));}
    else{c=mix(vec3(.02,.08,.25),vec3(.07,.27,.55),clamp(h*2.2+1.0,0.0,1.0));spec=0.75;}
    if(uScale<1.5) c=mix(c,vec3(.94,.96,.98),smoothstep(0.82,0.9,abs(t.y/uScale)));
    vec3 tc=t; tc.xz=rot2(uTime*0.02)*tc.xz;
    float cl=smoothstep(0.05,0.4,fbm(tc*2.4+s+40.0,5));
    c=mix(c,vec3(0.97),cl*0.92); spec*=1.0-cl;
    float night=smoothstep(0.08,-0.25,dot(n,uL));
    if(h>0.06) emit+=vec3(1.0,0.78,0.4)*night*smoothstep(0.55,0.85,snoise(t*22.0+s))*(1.0-cl)*0.9;
  } else if(ty<1.5){
    float nn=fbm(t*2.4+s,4)*0.5+0.5; c=mix(vec3(.05,.04,.04),vec3(.32,.25,.21),nn);
    float cr=ridged(t*3.4+s,4); float e=smoothstep(0.68,0.95,cr);
    float pulse=0.7+0.3*sin(uTime*2.2+t.x*5.0+t.y*3.0);
    emit=vec3(1.0,0.28+0.6*e*e,0.05*e)*e*pulse*1.4;
  } else if(ty<2.5){
    float nn=fbm(t*2.5+s,5)*0.5+0.5; c=mix(vec3(.45,.62,.8),vec3(.97,.99,1.0),nn);
    float cr=pow(ridged(t*6.0+s,3),7.0); c*=1.0-cr*vec3(.55,.3,.08); spec=0.5;
  } else if(ty<3.5){
    float fr=9.0+fract(uSeed*0.37)*6.0;
    float w=fbm(t*1.6+s+vec3(0.0,0.0,uTime*0.05),4);
    float b=sin(t.y*fr+w*3.2)*0.5+0.5+fbm(vec3(t.x*5.0,t.y*16.0,t.z*5.0)+s,3)*0.18;
    c=ramp3(b);
  } else if(ty<4.5){
    float nn=fbm(t*2.2+s,5)*0.5+0.5; float cr=ridged(t*6.0+s,3);
    c=ramp3(nn*1.1-0.05+pow(cr,6.0)*0.3);
  } else if(ty<5.5){
    float nn=fbm(t*2.0+s,5)*0.5+0.5;
    c=ramp3(nn+sin((t.x*0.8+t.y*0.4+t.z*0.3)*30.0+nn*8.0)*0.04);
  } else if(ty<6.5){
    float m=fbm(t*1.2+s,4); float nn=fbm(t*4.0+s,5)*0.5+0.5; float cr=ridged(t*8.0+s,3);
    float v=0.6+(nn-0.5)*0.4-smoothstep(0.0,0.3,m)*0.3+pow(cr,9.0)*0.3;
    c=mix(vec3(.22,.22,.24),vec3(.92,.92,.9),clamp(v,0.0,1.0));
  } else if(ty<7.5){
    float nn=fbm(t*2.2+s,6)*0.5+0.5; float dk=fbm(t*1.1+s+9.0,4);
    c=ramp5(clamp(nn-max(dk,0.0)*0.6,0.0,1.0),vec3(.3,.12,.07),vec3(.55,.23,.13),vec3(.7,.33,.18),vec3(.8,.46,.27),vec3(.9,.64,.44));

const hasTTS = 'speechSynthesis' in window;
let trVoice = null;
function pickVoice() {
  if (!hasTTS) return;
  const tr = speechSynthesis.getVoices().filter(v => /^tr/i.test(v.lang));
  const sc = v => { const s = (v.name + ' ' + v.voiceURI).toLowerCase(); return (/premium/.test(s) ? 50 : 0) + (/enhanced|gelişmiş/.test(s) ? 40 : 0) + (/natural|neural|online/.test(s) ? 45 : 0) + (/tolga|ahmet|male/.test(s) ? -20 : 0); };
  trVoice = tr.sort((a, b) => sc(b) - sc(a))[0] || null;
}
if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const voiceBufs = {};
let voiceSrc = null, voiceEnd = 0, voiceProtect = 0, decodingAll = false, ducked = false;
function b64ToBuf(b64) { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
function decodeVoice(k) {
  return new Promise(res => {
    if (voiceBufs[k] || !AC || !window.VOICE_MP3 || !VOICE_MP3[k]) return res();
    try { AC.decodeAudioData(b64ToBuf(VOICE_MP3[k]), b => { voiceBufs[k] = b; res(); }, () => res()); } catch (e) { res(); }
  });
}
async function decodeAllVoices() {
  if (decodingAll) return; decodingAll = true;
  for (const k of Object.keys(window.VOICE_MP3 || {})) await decodeVoice(k);
}
function stopVoice() { if (voiceSrc) { try { voiceSrc.stop(); } catch (e) {} voiceSrc = null; } if (hasTTS) speechSynthesis.cancel(); }
function speak(key, prio) {
  if (muted) return false;
  const now = rt();
  if (now < voiceProtect && !key.startsWith('info_')) return false;
  if (!prio && now < voiceEnd) return false;
  stopVoice();
  const buf = voiceBufs[key];
  if (buf && AC) {
    const s = AC.createBufferSource(); s.buffer = buf; s.connect(voiceBus); s.start(); voiceSrc = s;
    voiceEnd = now + buf.duration + 0.1;
  } else {
    const text = window.VOICE_TEXT && VOICE_TEXT[key];
    if (!text || !hasTTS) return false;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'tr-TR'; if (trVoice) u.voice = trVoice; u.rate = 1.02; u.pitch = 1.2;
    speechSynthesis.speak(u);

  return true;
}

    ctx.lineWidth = 5 * K; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(60,30,0,0.8)';
    const y = f.y - 20 * K - f.t * 60 * K;
    ctx.strokeText(f.text, f.x, y); ctx.fillStyle = '#ffe27a'; ctx.fillText(f.text, f.x, y);
  }
  ctx.globalAlpha = 1;
  drawHint();
  if (hero.locked) drawLockBubble();
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.55})`; ctx.fillRect(0, 0, W, H); }
  for (const p of popups) {
    const k = p.t < 0.3 ? easeOutBack(p.t / 0.3) : 1;
    const al = p.t > p.max - 0.4 ? (p.max - p.t) / 0.4 : 1;
    ctx.save(); ctx.globalAlpha = clamp(al, 0, 1);
    ctx.translate(W / 2, 62 * K); ctx.scale(k, k);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.font = `900 ${Math.round(30 * K)}px ${FONT}`;
    const bw = ctx.measureText(p.text).width + 34 * K, bh = 48 * K;
    ctx.fillStyle = 'rgba(5,8,30,.6)'; ctx.strokeStyle = 'rgba(255,212,59,.8)'; ctx.lineWidth = 2 * K;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2); else ctx.rect(-bw / 2, -bh / 2, bw, bh); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffe27a'; ctx.fillText(p.text, 0, 2 * K);
    ctx.restore();
  }
}

/* ---- karakter seçme kartları ---- */
const cards = [...document.querySelectorAll('.card')].map(el => ({ el, key: el.dataset.k, cv: el.querySelector('canvas') }));
function renderCards() {
  const K0 = K;
  for (const c of cards) {
    const w = c.cv.clientWidth || 200, h = c.cv.clientHeight || 215;
    if (c.cv.width !== Math.round(w * DPR)) { c.cv.width = Math.round(w * DPR); c.cv.height = Math.round(h * DPR); }
    ctx = c.cv.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, w, h);
    const ch = CHARS[c.key], b = BODY[ch.kind];
    const g = ctx.createRadialGradient(w / 2, h * 0.45, 10, w / 2, h * 0.45, w * 0.55);
    g.addColorStop(0, c.key === 'anne' ? 'rgba(255,120,200,0.35)' : c.key === 'baba' ? 'rgba(100,150,255,0.35)' : 'rgba(255,90,90,0.35)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const topU = b.helmC[1] - b.helm, botU = b.hipY + (b.foot - b.hipY) * 0.62;
    const s = (h - 28) / (botU - topU), ph = c.key === 'anne' ? 1 : c.key === 'baba' ? 2 : 0;
    const ang = Math.sin(time * 1.6 + ph) * 0.08, x = w / 2 - b.arm[4] * s * 0.45, y = 24 - topU * s + Math.sin(time * 2 + ph) * 2;
    const hx2 = b.arm[4], hy2 = b.arm[5] - 3 - b.gloveR;
    const wx = x + Math.cos(ang) * hx2 * s - Math.sin(ang) * hy2 * s, wy = y + Math.sin(ang) * hx2 * s + Math.cos(ang) * hy2 * s;
    K = w / 170; drawWeb(wx, wy, wx - ang * 60, -10); K = K0;
    drawCharacter(ch, { x, y, angle: ang, s, state: 'hang', onEarth: false, happy: true, blink: ((time + ph) % 3.7) < 0.13, crown: 0 });
  }
  ctx = mainCtx;
}

/* ================= KURULUM ================= */
let worldReady = false;
function resize() {
  if (window.innerWidth <= 0 || window.innerHeight <= 0) return;
  const oW = W;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  K = clamp(Math.min(W, H) / 560, 0.75, 1.6);
  HS = CH.scale * K;
  earth.x = W / 2; earth.r = Math.max(W, H) * 1.2;
  resizeGL();
  if (!worldReady) { worldReady = true; applyChar(); resetWorld(); return; }
  if (oW && oW !== W) {
    const r = W / oW;
    for (const arr of [anchors, stars, aliens, friends, particles, lastRow, misses, comets]) {
      for (const e of arr) { if (e.x !== undefined) e.x *= r; if (e.bx !== undefined) e.bx *= r; if (e.tx !== undefined) e.tx *= r; }
    }
    hero.x *= r;
    if (hero.zip && hero.zip.from) { hero.zip.from.x *= r; hero.zip.ctrl.x *= r; }
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (AC && AC.state !== 'running') AC.resume();
  onTap(e.clientX, e.clientY);
});
cvs.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchend', () => { if (AC && AC.state !== 'running') AC.resume(); }, { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (AC) AC.suspend(); stopVoice(); }
  else if (AC) AC.resume();
});

/* ---- giriş ekranı: müzik + "Kahramanını seç! Örümcek Feza! Örümcek Anne! Örümcek Baba!" ---- */
const MENU_SEQ = ['sec', 'ad_feza', 'ad_anne', 'ad_baba'];
let menuSeq = 0;
function menuIntro() {
  menuHeard = true;
  const id = ++menuSeq;
  startMusic('menu');
  Promise.all(MENU_SEQ.map(decodeVoice)).then(() => {
    let t = 300;
    for (const k of MENU_SEQ) {
      const card = cards.find(c => 'ad_' + c.key === k);
      setTimeout(() => {
        if (id !== menuSeq || started) return;
        speak(k, true);
        if (card) { card.el.classList.remove('say'); void card.el.offsetWidth; card.el.classList.add('say'); }
      }, t);
      t += ((voiceBufs[k] && voiceBufs[k].duration) || 1.2) * 1000 + 250;
    }
  });
}
for (const c of cards) c.el.addEventListener('animationend', e => { if (e.animationName === 'say') c.el.classList.remove('say'); });
// Tarayıcılar (özellikle iPad) ilk dokunuştan önce ses çaldırmaz: ses açılır açılmaz giriş müziği ve seslendirme başlar.
// Çocuk ilk dokunuşta doğrudan bir karta basarsa giriş seslendirmesi atlanır, oyun kendi karşılamasıyla başlar.
let menuReady = false, menuHeard = false;
function tryMenuIntro() {
  if (menuReady || started || !AC || AC.state !== 'running') return;
  menuReady = true;
  setTimeout(() => { if (!started && !menuHeard) menuIntro(); }, 250);
}
$('start').addEventListener('click', () => { initAudio(); tryMenuIntro(); });
if (!/ikon/.test(location.search)) { initAudio(); if (AC) { AC.addEventListener('statechange', tryMenuIntro); tryMenuIntro(); } }

function selectChar(key) {
  menuSeq++;
  initAudio();
  CH = CHARS[key]; applyChar();
  resetWorld();
  started = true; lastTap = time; nextComet = rand(7, 10);
  hintSays = 0; alienSays = 0; cometSays = 0; burnSays = 0;
  document.body.classList.add('playing');
  $('start').classList.add('hide');
  const intro = 'intro_' + key;
  decodeVoice(intro).then(() => { speak(intro, true); decodeAllVoices(); });
  startMusic();
  try {
    const el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
    const r = fs && fs.call(el);
    if (r && r.catch) r.catch(() => {});
  } catch (e) {}
}
for (const c of cards) c.el.addEventListener('click', () => {
  // ses henüz açılmadıysa ilk dokunuş giriş müziğini ve seslendirmeyi başlatır; kahraman bir sonraki dokunuşta seçilir
  if (!menuHeard) { initAudio(); menuIntro(); c.el.classList.remove('say'); void c.el.offsetWidth; c.el.classList.add('say'); return; }
  selectChar(c.key);
});
$('home').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  started = false; stopVoice(); voiceProtect = 0;
  document.body.classList.remove('playing');
  $('start').classList.remove('hide');
  resetWorld();
  menuIntro();
});
$('snd').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  muted = !muted;
  $('snd').textContent = muted ? '🔇' : '🔊';
  if (master) master.gain.value = muted ? 0 : 0.85;
  if (muted) stopVoice();
});

resize();
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (window.innerWidth > 0 && (!worldReady || window.innerWidth !== W || window.innerHeight !== H)) resize();
  if (worldReady) {
    update(dt);
    renderScene();
    render2D();
    if (!started) renderCards();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// iPad'de "Ana Ekrana Ekle" + internetsiz çalışma (service worker sadece http/https'te çalışır, file:// değil)
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !/ikon/.test(location.search)) navigator.serviceWorker.register('sw.js').catch(() => {});

// ?ikon → big Örümcek Feza hanging from his web over the space scene; used to render the app icon
if (/ikon/.test(location.search)) {
  muted = true;
  for (const id of ['start', 'hud', 'btns']) { const el = $(id); if (el) el.style.display = 'none'; }
  const ic = document.createElement('canvas'); ic.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none';
  document.body.appendChild(ic);
  const q = new URLSearchParams(location.search), zoom = Number(q.get('z') || 0.6);
  (function iconFrame() {
    const w = innerWidth, h = innerHeight; ic.width = Math.round(w * DPR); ic.height = Math.round(h * DPR);
    const K0 = K; ctx = ic.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, w, h);
    const ch = CHARS.feza, b = BODY[ch.kind];
    const g = ctx.createRadialGradient(w / 2, h * 0.5, 10, w / 2, h * 0.5, w * 0.5);
    g.addColorStop(0, 'rgba(255,90,90,0.30)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const topU = b.helmC[1] - b.helm, botU = b.hipY + (b.foot - b.hipY) * 0.62;
    const sc = h * zoom / (botU - topU), x = w / 2 - b.arm[4] * sc * 0.4, y = h * 0.17 - topU * sc;
    const hx2 = b.arm[4], hy2 = b.arm[5] - 3 - b.gloveR;
    K = w / 150; drawWeb(x + hx2 * sc, y + hy2 * sc, x + hx2 * sc + 20, -10); K = K0;
    drawCharacter(ch, { x, y, angle: 0.05, s: sc, state: 'hang', onEarth: false, happy: true, blink: false, crown: 0 });
    ctx = mainCtx; requestAnimationFrame(iconFrame);
  })();
}
